<div class="card_admin">
    <h3>Gerenciar Funcionários Existentes</h3>
    <form method="POST">
        <label>Selecione o Usuário:</label>
        <select name="funcionario" required>
            {% for user in usuarios %}
                <option value="{{ user.login }}">{{ user.login }} [Perfis: {{ user.role }} | Status: {{ user.status }}]</option>
            {% endfor %}
        </select>

        <label>Nova Senha (Apenas se for alterar):</label>
        <input type="password" name="nova_senha" placeholder="Digite uma nova senha se aplicável...">

        <div style="border: 1px solid #334155; padding: 15px; margin: 15px 0; border-radius: 6px; background: rgba(30,41,59,0.5);">
            <label style="color: #94a3b8; font-weight: bold;">⏱️ Parâmetros para Restrição Temporária:</label>
            <input type="text" name="tempo_bloqueio" placeholder="Ex: 5 dias, 24 horas, Até segunda-feira...">
            <small style="color: #64748b; display: block; margin-top: 5px;">Este período será registrado nos logs de auditoria do sistema.</small>
        </div>

        <label>Chave de Verificação Secundária (Mestra):</label>
        <input type="password" name="verificacao_seguranca" required placeholder="Digite a chave para autorizar a alteração...">

        <div class="admin-actions-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px;">
            <button type="submit" name="acao" value="alterar_dados" style="background: #2563eb; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer;">Atualizar Dados</button>
            <button type="submit" name="acao" value="restringir_temp" style="background: #d97706; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer;">Bloqueio Temporário</button>
            <button type="submit" name="acao" value="excluir" style="background: #dc2626; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer;" onclick="return confirm('Tem certeza absoluta que deseja EXCLUIR este usuário permanentemente do banco de dados?');">Excluir Usuário</button>
        </div>
    </form>
</div>
