<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Editar Material</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 50px;">
        <h2>Editar Informações do Material</h2>
        
        <p style="color: var(--gray-muted); margin-bottom: 25px;">
            Código Atual: <code>{{ produto.id_produto }}</code> 
        </p>
        
        <form method="POST">
            <label>Nome do Produto:</label>
            <input type="text" name="nome" value="{{ produto.nome }}" list="produtos-existentes" required autocomplete="off">
            
            <datalist id="produtos-existentes">
                {% for nome in sugestoes %}
                    <option value="{{ nome }}">
                {% endfor %}
            </datalist>

            <label>Área de Uso / Setor:</label>
            <select name="area" required>
                <option value="Geral" {% if produto.area == 'Geral' %}selected{% endif %}>⚙️ Utilidade Geral</option>
                <option value="Mecânica" {% if produto.area == 'Mecânica' %}selected{% endif %}>🔧 Setor Mecânico</option>
                <option value="Elétrica" {% if produto.area == 'Elétrica' %}selected{% endif %}>⚡ Setor Elétrico</option>
            </select>

            <label>Quantidade em Stock:</label>
            <input type="number" name="quantidade" min="0" value="{{ produto.quantidade }}" required>

            <label>Especificação / Descrição do Tipo:</label>
            <textarea name="descricao" rows="4" maxlength="255">{{ produto.descricao if produto.descricao else '' }}</textarea>

            <label>Link da Imagem (URL):</label>
            <input type="url" name="link_imagem" value="{{ produto.link_imagem if produto.link_imagem else '' }}" placeholder="https://exemplo.com/imagem.jpg">

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" name="botao_acao" value="salvar" style="flex: 2;">Salvar Alterações</button>
                <button type="submit" name="botao_acao" value="excluir" style="background: #ef4444; flex: 1;" onclick="return confirm('ATENÇÃO: Deseja apagar este produto para corrigir um lançamento incorreto? Todas as unidades registradas serão descartadas permanentemente do estoque.');">🗑️ Apagar Produto</button>
                <a href="{{ url_for('lobby') }}" class="btn" style="text-align: center; background:#6b7280; line-height: 38px;">Cancelar</a>
            </div>
        </form>
    </div>

</body>
</html>
