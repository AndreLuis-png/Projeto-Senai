<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <link rel="icon" type="image/jpg" href="/static/çenay.jpg">
    <meta charset="UTF-8">
    <title>Login - Almoxarifado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="container login-card">
        <h2 style="margin-top:0;">Autenticação</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-message flash-error">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Utilizador:</label>
            <input type="text" name="usuario" required autocomplete="off">
            
            <label>Palavra-passe:</label>
            <input type="password" name="senha" required>
            
            <button type="submit" style="margin-top: 10px;">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
