<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Almoxarifado - Acesso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="container login-card">
        <h2 style="margin-top: 0; color: #0f172a;">Acesso ao Sistema</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-message flash-error">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" style="border: none; padding: 0; margin: 0;">
            <label>Usuário do Sistema:</label>
            <input type="text" name="usuario" required autocomplete="off">
            
            <label>Senha de Acesso:</label>
            <input type="password" name="senha" required>
            
            <div class="checkbox-container">
                <input type="checkbox" name="admin_mode" id="admin_mode">
                <label for="admin_mode" style="margin: 0; user-select: none;">Autenticar como Administrador</label>
            </div>
            
            <button type="submit" style="width: 100%; padding: 12px;">Entrar no Painel</button>
        </form>
    </div>
</body>
</html>
