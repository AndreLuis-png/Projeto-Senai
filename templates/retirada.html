<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Saída / Baixa de Material</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Painel do Almoxarifado</h1>
        <p>Operador: <strong>{{ session['usuario'] }}</strong></p>
        <nav>
            <a href="{{ url_for('lobby') }}">🔎 Consultar Estoque</a> 
            <a href="{{ url_for('insercao') }}">📥 Entrada de Material</a> 
            <a href="{{ url_for('retirada') }}" class="active">📤 Saída / Baixa</a> 
            {% if session['is_admin'] %}
                <a href="{{ url_for('admin_panel') }}" style="color:#f87171;">🛠️ Administração</a>
            {% endif %}
            <a href="{{ url_for('logout') }}" style="margin-left: auto; background: rgba(239,68,68,0.2);">Sair</a>
        </nav>
    </header>

    <div class="container" style="max-width: 600px; margin-top: 30px;">
        <h2>Registo de Saída / Baixa do Estoque</h2>
        
        <form method="POST">
            <label>Selecione o Item para Saída:</label>
            <select name="id_produto" required>
                {% for item in estoque %}
                    <option value="{{ item.id_produto }}">{{ item.id_produto }} - {{ item.nome }} [Disponível: {{ item.quantidade }} un]</option>
                {% endfor %}
            </select>

            <label>Quantidade a Retirar:</label>
            <input type="number" name="quantidade" min="1" value="1" required>

            <button type="submit" style="background-color: #dc2626; color: white;">Confirmar Baixa no Sistema</button>
        </form>
    </div>
</body>
</html>
